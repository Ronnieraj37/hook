# Free keeper: GitHub Actions runs scripts/keeper.ts on a schedule.
# OFF until you set the repository variable KEEPER_ENABLED=true (Settings > Secrets and variables > Actions > Variables).
# Secrets needed: KEEPER_PRIVATE_KEY (a funded Sepolia key) and SEPOLIA_RPC_URL (e.g. your Alchemy URL).
# Public repos: unlimited free minutes. Private repos: 2,000 free minutes a month, so use */15 or slower there.
# GitHub may start scheduled runs a few minutes late, and pauses schedules after 60 days without repo activity.
name: keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  run:
    if: vars.KEEPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/keeper.ts
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
